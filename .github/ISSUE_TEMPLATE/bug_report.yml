name: Bug or configuration problem
description: Report a reproducibility command, configuration, data, model, metric, or documentation failure.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include tokens, credentials, private data, or unpublished artifacts.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Environment or installation
        - Data preparation
        - Training or resume
        - Evaluation or inference
        - Checkpoint or artifact validation
        - Metrics
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Windows
        - Cuboids
        - Shelves
        - Containers
        - All categories
        - Not category-specific
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and configuration
      description: Include the command, seed, config overrides, and any local modifications.
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the complete error or the smallest relevant log excerpt.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Report OS, Python, PyTorch, CUDA, GPU, and the output of `python reproduce.py doctor` when available.
      render: text
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Code and artifact revisions
      description: Commit SHA plus Hugging Face dataset/model revisions, if relevant.
      placeholder: "code: abc123; dataset: ...; model: ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction steps
      description: Start from the earliest step required to reproduce the failure.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and removed secrets and private data.
          required: true
        - label: I identified whether this is a smoke-test result or a complete experiment.
          required: true
